{% extends 'base.html' %}

{% block title %}Contact Us | Saj-Sojja{% endblock %}

{% block extra_css %}
<style>
    /* ============================================================
       CONTACT PAGE STYLES
       ============================================================ */

    #section-contact {
        max-width: 720px;
        margin: 0 auto;
        padding: 2.25rem 2rem 2.5rem;
        background: var(--glass-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        position: relative;
        overflow: hidden;
        animation: contactRise 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* white glow top-right */
    #section-contact::before {
        content: "";
        position: absolute;
        top: -140px;
        right: -120px;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.2), transparent 70%);
        pointer-events: none;
    }

    /* white glow bottom-left */
    #section-contact::after {
        content: "";
        position: absolute;
        bottom: -150px;
        left: -130px;
        width: 280px;
        height: 280px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.12), transparent 70%);
        pointer-events: none;
    }

    @keyframes contactRise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Header ---------- */
    #section-contact h2 {
        position: relative;
        z-index: 1;
        font-family: 'Outfit', sans-serif;
        font-size: 1.65rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--text-main);
        text-align: center;
        margin-bottom: 1.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
    }

    #section-contact h2::before {
        content: "\f0e0";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        font-size: 1.35rem;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        background: #ffffff;
        box-shadow: 0 10px 26px rgba(255, 255, 255, 0.3);
    }

    /* ---------- Form ---------- */
    #section-contact form {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
    }

    #section-contact form p {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin: 0;
    }

    #section-contact form label {
        font-size: 0.76rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-muted);
    }

    /* inputs, textarea, email, text */
    #section-contact input[type="text"],
    #section-contact input[type="email"],
    #section-contact input[type="password"],
    #section-contact input[type="number"],
    #section-contact textarea,
    #section-contact select {
        width: 100%;
        padding: 0.85rem 1.05rem;
        font-family: inherit;
        font-size: 0.92rem;
        color: var(--text-main);
        background: rgba(18, 18, 18, 0.9);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        outline: none;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    #section-contact input::placeholder,
    #section-contact textarea::placeholder {
        color: #666666;
    }

    #section-contact input:hover,
    #section-contact textarea:hover {
        border-color: rgba(255, 255, 255, 0.3);
    }

    #section-contact input:focus,
    #section-contact textarea:focus,
    #section-contact select:focus {
        border-color: #ffffff;
        background: rgba(0, 0, 0, 0.95);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
    }

    #section-contact textarea {
        min-height: 140px;
        resize: vertical;
        line-height: 1.6;
    }

    /* Chrome autofill */
    #section-contact input:-webkit-autofill,
    #section-contact textarea:-webkit-autofill {
        -webkit-text-fill-color: var(--text-main);
        transition: background-color 9999s ease-out 0s;
        caret-color: var(--text-main);
    }

    /* ---------- Submit button ---------- */
    #submit_btn {
        margin-top: 0.5rem;
        padding: 0.9rem 1.25rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        font-family: 'Outfit', sans-serif;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        color: #000000;
        background: #ffffff;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(255, 255, 255, 0.25);
        transition: transform 0.2s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    #submit_btn::before {
        content: "\f1d8";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        font-size: 0.9rem;
    }

    #submit_btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(255, 255, 255, 0.4);
        background: #f0f0f0;
    }

    #submit_btn:active {
        transform: translateY(0);
        box-shadow: 0 6px 16px rgba(255, 255, 255, 0.2);
    }

    /* ---------- Help text + errors ---------- */
    #section-contact .helptext {
        display: block;
        margin-top: 0.35rem;
        font-size: 0.74rem;
        line-height: 1.55;
        color: var(--text-muted);
    }

    #section-contact .errorlist {
        list-style: none;
        margin: 0.4rem 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
    }

    #section-contact .errorlist li {
        display: flex;
        align-items: flex-start;
        gap: 0.45rem;
        font-size: 0.78rem;
        font-weight: 500;
        color: #fca5a5;
        line-height: 1.5;
    }

    #section-contact .errorlist li::before {
        content: "\f06a";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        font-size: 0.72rem;
        margin-top: 0.15rem;
    }

    #section-contact form p:has(.errorlist) input,
    #section-contact form p:has(.errorlist) textarea {
        border-color: rgba(239, 68, 68, 0.6);
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
    }

    /* ---------- Success / info message ---------- */
    #section-contact .contact-message {
        position: relative;
        z-index: 1;
        margin-top: 1.25rem;
        padding: 0.9rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.7rem;
        font-size: 0.9rem;
        font-weight: 500;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffffff;
        animation: contactRise 0.35s ease-out;
    }

    #section-contact .contact-message i {
        font-size: 1rem;
    }

    /* success variant (green) */
    #section-contact .contact-message.is-success {
        background: rgba(16, 185, 129, 0.14);
        border-color: rgba(16, 185, 129, 0.4);
        color: #6ee7b7;
    }

    /* error variant (red) */
    #section-contact .contact-message.is-error {
        background: rgba(239, 68, 68, 0.14);
        border-color: rgba(239, 68, 68, 0.4);
        color: #fca5a5;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 560px) {
        #section-contact {
            padding: 1.75rem 1.25rem 2rem;
            border-radius: 20px;
        }

        #section-contact h2 {
            font-size: 1.35rem;
            flex-direction: column;
            gap: 0.5rem;
        }
    }
</style>
{% endblock extra_css %}

{% block content %}
<section id="section-contact">
    <h2>Register To Our Website</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" id="submit_btn" value="Send Message">
    </form>

</section>
{% endblock content %}

{% extends 'base.html' %}

{% block title %}Welcome | Saj-Sojja{% endblock %}

{% block extra_css %}
<style>
    /* ============================================================
       WELCOME / CONTACT FORM STYLES
       ============================================================ */

    #section-contact {
        max-width: 720px;
        margin: 0 auto;
        padding: 2.25rem 2rem 2.5rem;
        background: var(--glass-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        position: relative;
        overflow: hidden;
        animation: welcomeRise 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* indigo glow top-right */
    #section-contact::before {
        content: "";
        position: absolute;
        top: -140px;
        right: -120px;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.32), transparent 70%);
        pointer-events: none;
    }

    /* pink glow bottom-left */
    #section-contact::after {
        content: "";
        position: absolute;
        bottom: -150px;
        left: -130px;
        width: 280px;
        height: 280px;
        background: radial-gradient(circle, rgba(236, 72, 153, 0.2), transparent 70%);
        pointer-events: none;
    }

    @keyframes welcomeRise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Heading ---------- */
    #section-contact h2 {
        position: relative;
        z-index: 1;
        font-family: 'Outfit', sans-serif;
        font-size: 1.65rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--text-main);
        text-align: center;
        margin-bottom: 1.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
    }

    #section-contact h2::before {
        content: "\f2b5"; /* hand-wave */
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        font-size: 1.3rem;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        box-shadow: 0 10px 26px rgba(99, 102, 241, 0.38);
    }

    /* ---------- Form ---------- */
    #section-contact form {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
    }

    #section-contact form p {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin: 0;
    }

    #section-contact form label {
        font-size: 0.76rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-muted);
    }

    /* inputs, textarea, select */
    #section-contact input[type="text"],
    #section-contact input[type="email"],
    #section-contact input[type="tel"],
    #section-contact input[type="number"],
    #section-contact input[type="password"],
    #section-contact textarea,
    #section-contact select {
        width: 100%;
        padding: 0.85rem 1.05rem;
        font-family: inherit;
        font-size: 0.92rem;
        color: var(--text-main);
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        outline: none;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    #section-contact input::placeholder,
    #section-contact textarea::placeholder {
        color: #64748b;
    }

    #section-contact input:hover,
    #section-contact textarea:hover {
        border-color: rgba(255, 255, 255, 0.2);
    }

    #section-contact input:focus,
    #section-contact textarea:focus,
    #section-contact select:focus {
        border-color: var(--primary);
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    #section-contact textarea {
        min-height: 140px;
        resize: vertical;
        line-height: 1.6;
    }

    /* Chrome autofill */
    #section-contact input:-webkit-autofill,
    #section-contact textarea:-webkit-autofill {
        -webkit-text-fill-color: var(--text-main);
        transition: background-color 9999s ease-out 0s;
        caret-color: var(--text-main);
    }

    /* select arrow */
    #section-contact select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        cursor: pointer;
        padding-right: 2.75rem;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 1rem center;
        background-size: 16px;
    }

    /* ---------- Submit button ---------- */
    #submit_btn {
        margin-top: 0.5rem;
        padding: 0.9rem 1.25rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        font-family: 'Outfit', sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(99, 102, 241, 0.3);
        transition: transform 0.2s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    #submit_btn::before {
        content: "\f1d8"; /* paper plane */
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        font-size: 0.9rem;
    }

    #submit_btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(236, 72, 153, 0.35);
        filter: brightness(1.06);
    }

    #submit_btn:active {
        transform: translateY(0);
        box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
    }

    /* ---------- Help text + errors ---------- */
    #section-contact .helptext {
        display: block;
        margin-top: 0.35rem;
        font-size: 0.74rem;
        line-height: 1.55;
        color: var(--text-muted);
    }

    #section-contact .errorlist {
        list-style: none;
        margin: 0.4rem 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
    }

    #section-contact .errorlist li {
        display: flex;
        align-items: flex-start;
        gap: 0.45rem;
        font-size: 0.78rem;
        font-weight: 500;
        color: #fca5a5;
        line-height: 1.5;
    }

    #section-contact .errorlist li::before {
        content: "\f06a";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        font-size: 0.72rem;
        margin-top: 0.15rem;
    }

    #section-contact form p:has(.errorlist) input,
    #section-contact form p:has(.errorlist) textarea {
        border-color: rgba(239, 68, 68, 0.6);
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
    }

    /* ---------- Message pills (top and bottom) ---------- */
    #section-contact > div {
        position: relative;
        z-index: 1;
        margin: 0 0 1.25rem;
        padding: 0.9rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.7rem;
        font-size: 0.9rem;
        font-weight: 500;
        line-height: 1.5;
        border-radius: 12px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.35);
        color: #a5b4fc;
        animation: welcomeRise 0.35s ease-out;
    }

    /* auto-prepend a check icon to each message line */
    #section-contact > div::before {
        content: "\f058";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        font-size: 1rem;
        flex-shrink: 0;
    }

    /* the bottom block sits after the form, so give it top margin instead */
    #section-contact form + div {
        margin: 1.25rem 0 0;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 560px) {
        #section-contact {
            padding: 1.75rem 1.25rem 2rem;
            border-radius: 20px;
        }

        #section-contact h2 {
            font-size: 1.35rem;
            flex-direction: column;
            gap: 0.5rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<section id="section-contact">

    <h2>Log-In</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" id="submit_btn" value="Submit">
    </form>


</section>
{% endblock content %}

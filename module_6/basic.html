<style>
    #section-feature {
        display: flex; /* Enables flexbox for the main container */
        gap: 20px; /* Optional: adds space between the two columns */
        /* align-items: flex-start; Aligns columns to the top */
    }

    .column {
        display: flex; /* Enables flexbox for the columns */
        flex-direction: column; /*Stacks children (p tags) vertically*/
        flex: 1; /* Makes both columns take up equal width */
        gap: 10px; /* Optional: adds space between rows inside the column */
    }

    .row {
        margin: 0;

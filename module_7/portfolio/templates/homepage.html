<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Personal Homepage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        #section-portfolio{
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            padding-bottom: 30px;
        }

        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 150px;
            position: relative;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #fff;
            object-fit: cover;
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ddd;
        }

        .profile-content {
            margin-top: 70px; /* Space for the image overlap */
            padding: 0 20px;
        }

        h1 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .introduction {
            font-size: 14px;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Skills Section */
        .skills-section {
            text-align: left;
        }

        .skills-section h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
            display: inline-block;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .skill-tag {
            background-color: #edf2f7;
            color: #4a5568;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .skill-tag:hover {
            background-color: #667eea;
            color: #fff;
        }
        footer{

        }
    </style>
</head>
<body>
    {% include 'header.html' %}   
    <section id="section-portfolio">
        <div class="profile-card">
        <!-- Header Background -->
        <div class="profile-header">
            <!-- Replace 'your-photo.jpg' with your actual image file path or URL -->
            <img src="https://i.redd.it/ktr1tkoymq881.jpg" alt="Profile Picture" class="profile-img">
        </div>

        <div class="profile-content">
            <!-- Your Name -->
            <h1>Jack Daniels</h1>
            
            <!-- Short Introduction -->
            <p class="introduction">
                Hello! I am a passionate developer based in Dhaka. I love building clean, 
                efficient web applications and solving complex problems with code.
            </p>

            <!-- Skills Section -->
            <div class="skills-section">
                <h3>My Skills</h3>
                <div class="skill-tags">
                    <span class="skill-tag">HTML5</span>
                    <span class="skill-tag">CSS3</span>
                    <span class="skill-tag">JavaScript</span>
                    <span class="skill-tag">Python</span>
                    <span class="skill-tag">Django</span>
                    <span class="skill-tag">Git</span>
                    <span class="skill-tag">SQL</span>
                </div>
            </div>
        </div>
    </div>
    </section>

    <footer>
        <p>&copy; 2026 Jack Daniels. All rights reserved.</p>
    </footer>
    

</body>
</html>

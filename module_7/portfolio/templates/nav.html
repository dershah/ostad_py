    <style>
        * {
            margin: 0;

        body{

        }

            text-align: center;

        }

        }

            border: 1px solid #f2f2f2;
            color: #fff;
            background-color:#29400E;
        }

    <body>
        <header id="header">

        <nav id="navigation">
